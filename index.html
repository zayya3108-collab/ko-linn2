<!doctype html>
<html lang="my"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="KO LINN"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>KO LINN | Premium Digital Business Card</title>
<style>
:root{--gold:#e8c56d;--muted:#a9b8ca}
*{box-sizing:border-box}
html{min-height:100%;background:#020b19}body{margin:0;min-height:100vh;min-height:100svh;padding:max(8px,env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));font-family:Arial,"Noto Sans Myanmar",sans-serif;color:#f7f8fc;background:linear-gradient(180deg,#020b19 0%,#071629 52%,#050b15 100%);display:flex;justify-content:center;align-items:flex-start}
.wrap{width:min(100%,560px);min-height:calc(100vh - 28px);min-height:calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 28px);margin:0 auto;display:flex;align-items:center}.card{width:100%}
.card{position:relative;border:1px solid rgba(218,190,119,.4);border-radius:28px;padding:0 18px 20px;background:linear-gradient(155deg,#06162d 0%,#071326 52%,#08101e 100%);box-shadow:0 16px 55px #0009;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 14%,#17416a4d,transparent 42%),linear-gradient(145deg,transparent 0 35%,#d8b96a12 35.1%,transparent 35.4% 65%,#d8b96a0c 65.2%,transparent 65.5%)}
.brand{position:relative;text-align:center;font-size:10px;letter-spacing:3.5px;color:var(--gold);font-weight:800;padding-top:30px}
.avatar{position:relative;width:160px;height:160px;margin:22px auto 17px;border-radius:50%;overflow:hidden;border:4px solid #e8c56d;box-shadow:0 0 0 5px #d9b66d20,0 0 24px #e4bd5b3b;background:#172033}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
h1{position:relative;text-align:center;margin:0;font-size:clamp(30px,7.4vw,40px);font-weight:800;letter-spacing:3px;color:#f3d78f;text-shadow:0 2px 14px #e8c56d35}
.sub{position:relative;text-align:center;color:#d7e0ed;font-size:14px;margin:8px 0 0}
.gold-rule{position:relative;width:112px;height:2px;margin:19px auto 24px;background:linear-gradient(90deg,transparent,#e8c56d,transparent);box-shadow:0 0 10px #e8c56d77}
.intro{position:relative;text-align:center;margin:0 -18px 22px;padding:20px 12px 0;border-top:1px solid #ffffff0d;color:#dce5f1;font-size:14px;line-height:1.55}
.intro .myanmar{font-size:16px;margin-bottom:2px}
.links{position:relative;display:grid;gap:11px}
.link{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:78px;border:1.5px solid var(--accent);border-radius:25px;text-decoration:none;color:#fff;background:linear-gradient(105deg,color-mix(in srgb,var(--accent) 13%,#06101d),#071326 38%,#030914 100%);box-shadow:inset 0 1px 0 #ffffff20,inset 0 -1px 0 color-mix(in srgb,var(--accent) 32%,transparent),0 7px 20px #0008,0 0 8px color-mix(in srgb,var(--accent) 52%,transparent),0 0 19px color-mix(in srgb,var(--accent) 25%,transparent);position:relative;overflow:hidden;isolation:isolate;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.link:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 10%,color-mix(in srgb,var(--accent) 13%,transparent) 48%,transparent 82%);opacity:.95}
.link:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,#ffffff35,transparent);animation:barshine 3.8s ease-in-out infinite;pointer-events:none}
@keyframes barshine{0%,55%{left:-60%}100%{left:140%}}
.link:active{transform:scale(.985);box-shadow:inset 0 1px 0 #ffffff25,0 3px 12px #0007,0 0 22px color-mix(in srgb,var(--accent) 55%,transparent)}
.icon{width:50px;height:50px;flex:0 0 50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 100%,white),color-mix(in srgb,var(--accent) 75%,#06101d));color:white;font-size:25px;font-weight:bold;box-shadow:0 0 13px color-mix(in srgb,var(--accent) 48%,transparent),inset 0 1px 0 #ffffff55;border:1px solid #ffffff35}
.icon svg{filter:drop-shadow(0 1px 1px #0004)}
.icon svg{width:29px;height:29px;display:block}.info{min-width:0;flex:1}.label{font-size:15px;font-weight:800;letter-spacing:.15px}.detail{font-size:12px;color:#b4c2d3;margin-top:4px;overflow-wrap:anywhere}.arrow{color:var(--accent);font-size:27px;font-weight:300;margin-right:2px;text-shadow:0 0 12px var(--accent)}
.phone{--accent:#16e879}.telegram{--accent:#16baff}.viber{--accent:#b45cff}.tiktok{--accent:#ff4ca6}
.qrbox{position:relative;margin:20px auto 0;padding:11px;width:max-content;max-width:100%;text-align:center;border:1px solid rgba(217,182,109,.42);border-radius:15px;background:#fff;color:#172033}
#qrcode{width:132px;height:132px;margin:auto;display:grid;place-items:center}#qrcode img,#qrcode canvas{max-width:132px;max-height:132px}
.qrlabel{font-size:10px;margin-top:7px;color:#536071}.foot{position:relative;text-align:center;color:#8292a8;font-size:9px;letter-spacing:1.8px;margin-top:16px}
@media(max-width:420px){body{padding:6px 8px 18px}.card{padding-left:14px;padding-right:14px;border-radius:24px}.brand{padding-top:25px}.avatar{width:144px;height:144px;margin:19px auto 15px}.sub{font-size:13px}.gold-rule{margin:16px auto 20px}.intro{margin-left:-14px;margin-right:-14px;padding-top:17px;font-size:13px}.intro .myanmar{font-size:15px}.link{min-height:74px;padding:9px 13px;gap:12px}.icon{width:49px;height:49px;flex-basis:49px;border-radius:14px;font-size:23px}.label{font-size:15px}.detail{font-size:12px}.links{gap:10px}}

@media(max-width:420px){}

.creator-contact{position:relative;margin:18px auto 0;padding:13px 10px 2px;text-align:center;border-top:1px solid rgba(232,197,109,.12);opacity:.78}
.creator-caption{display:block;color:#8390a2;font-size:8px;letter-spacing:2.4px;font-weight:600;margin-bottom:6px}
.creator-contact a{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;text-decoration:none;color:#c9b987;padding:5px 10px;border:0;border-radius:999px;background:transparent;transition:opacity .2s ease}
.creator-name{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#d6c28f}
.creator-telegram{font-size:10px;color:#8999ad;letter-spacing:.2px}
.creator-arrow{font-size:11px;color:#9e8a5e;opacity:.8}
.creator-contact a:active{opacity:.65}

<script>
(() => {
  const installButton = document.getElementById('installApp');
  let installEvent = null;
  const isStandalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (installButton && !isStandalone()) {
    installButton.hidden = false;
    installButton.style.display = 'block';
  }
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installEvent = event;
    if (installButton && !isStandalone()) {
      installButton.hidden = false;
      installButton.style.display = 'block';
    }
  });
  if (installButton) {
    installButton.addEventListener('click', async () => {
      if (installEvent) {
        installEvent.prompt();
        await installEvent.userChoice;
        installEvent = null;
        installButton.hidden = true;
        installButton.style.display = 'none';
      } else {
        alert('Chrome Menu (⋮) ကိုဖွင့်ပြီး “Add to Home screen” သို့မဟုတ် “Install app” ကိုရွေးပါ။');
      }
    });
  }
  window.addEventListener('appinstalled', () => {
    if (installButton) {
      installButton.hidden = true;
      installButton.style.display = 'none';
    }
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
